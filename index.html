<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<meta name="description" content="端末内に保存するオフライン対応の精霊チェックリスト">
<link rel="manifest" href="./manifest.webmanifest">
<title>精霊チェッカー</title>
<style>
:root{color-scheme:dark;--bg:#0b0e15;--panel:#141925;--panel2:#1b2231;--line:#2b3447;--text:#f3f5fb;--muted:#9ba7bb;--accent:#8b7cff;--green:#61d6a6;--red:#ff778b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2040 0,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px;transition:transform .15s,border-color .15s}button:active{transform:scale(.98)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}button.danger{color:#ffb4bf}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.wrap{max-width:1000px;margin:auto;padding:20px 14px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#a195ff,#5c4ee6);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 30px #6256d944}.brand h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.panel{background:#141925eF;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 12px 35px #0002}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--panel2);padding:12px;border-radius:13px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:3px}.controls{display:grid;grid-template-columns:1fr auto;gap:9px}.field{width:100%;background:#0d111b;color:var(--text);border:1px solid var(--line);padding:11px 12px;border-radius:12px;min-width:0}.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-top:10px}.filters button{white-space:nowrap;padding:8px 12px;font-size:13px}.filters button.active{background:#403a79;border-color:#8276ff}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{display:flex;gap:11px;align-items:center;min-width:0;background:linear-gradient(145deg,#1b2231,#121722);border:1px solid var(--line);border-radius:16px;padding:11px;animation:appear .25s ease both}.portrait{width:66px;height:66px;flex:none;border-radius:12px;background:#0b0e15;border:1px solid #31394a;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:24px}.portrait img{width:100%;height:100%;object-fit:cover}.details{min-width:0;flex:1}.name{font-weight:750;overflow-wrap:anywhere;font-size:14px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tag{font-size:10px;border-radius:7px;padding:3px 6px;background:#292f41;color:#d1d7e6}.tag.owned{background:#163b32;color:#82efc4}.tag.missing{background:#40232c;color:#ffabb7}.tag.new{background:#342d56;color:#c6baff}.mini{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;color:var(--muted)}.mini input{accent-color:var(--accent)}.item-actions{display:flex;gap:5px;margin-top:8px}.item-actions button{font-size:11px;padding:5px 8px;border-radius:8px}.empty{text-align:center;padding:40px 10px;color:var(--muted)}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{font-size:12px}.notice{font-size:12px;color:var(--muted);line-height:1.65;margin-top:10px}dialog{background:#151a28;color:var(--text);border:1px solid var(--line);border-radius:18px;width:min(520px,calc(100% - 24px));padding:18px;box-shadow:0 25px 100px #0009}dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}dialog h2{margin:0 0 14px;font-size:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{display:block;font-size:12px;color:var(--muted)}.formgrid input,.formgrid select{display:block;margin-top:5px}.formgrid .wide{grid-column:1/-1}.checks{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px}.checks label{display:flex;align-items:center;gap:7px;color:var(--text)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#262d40;border:1px solid #46506a;padding:10px 15px;border-radius:12px;box-shadow:0 8px 30px #0007;z-index:10;font-size:13px;max-width:90vw}.hidden{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:560px){.wrap{padding:14px 10px 35px}.brand h1{font-size:18px}.list{grid-template-columns:1fr}.item{padding:10px}.portrait{width:62px;height:62px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:20px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.top{align-items:flex-start}.top .toolbar{justify-content:flex-end}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>精霊チェッカー</h1><div class="sub">自分のコレクションを記録 · オフライン対応</div></div></div><div class="toolbar"><button id="addBtn" class="primary">＋ 追加</button></div></header>
<section class="panel"><div class="stats"><div class="stat"><span>登録数</span><strong id="total">0</strong></div><div class="stat"><span>所持</span><strong id="ownedCount">0</strong></div><div class="stat"><span>Master</span><strong id="masterCount">0</strong></div></div></section>
<section class="panel"><div class="controls"><input class="field" id="search" type="search" placeholder="精霊名で検索…" aria-label="精霊名で検索"><select class="field" id="sort" aria-label="並び替え"><option value="name">名前順</option><option value="level">レベル順</option><option value="owned">所持優先</option></select></div><nav class="filters" id="filters" aria-label="絞り込み"><button class="active" data-filter="all">すべて</button><button data-filter="owned">所持</button><button data-filter="missing">未所持</button><button data-filter="master">Master</button><button data-filter="upcoming">登場予定</button><button data-filter="new">新着</button></nav><p class="notice">● <span id="saveState">自動保存オン</span> · 記録はこのブラウザ内に保存されます。画像をアップロードすると小さく圧縮して端末内に保存します。定期的にバックアップしてください。</p></section>
<section id="list" class="list" aria-live="polite"></section>
<section class="panel"><h2 style="font-size:15px;margin:0 0 10px">データ管理</h2><div class="toolbar"><button id="exportBtn">JSONバックアップ</button><button id="importBtn">バックアップを復元</button><button id="sampleBtn">サンプルを追加</button><button id="clearBtn" class="danger">全データ削除</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div><p class="notice">バックアップには登録情報・所持状況・レベル・画像データが含まれます。画像を含めるとファイルが大きくなります。別の端末に移すときはJSONバックアップを使ってください。</p></section>
<div class="foot">Sprite Check · データは端末内のみ。アカウント・サーバー接続はありません。</div>
</main>
<dialog id="editor"><form id="editForm"><h2 id="dialogTitle">精霊を追加</h2><input id="editId" type="hidden"><div class="formgrid">
<label class="wide">精霊名 *<input class="field" id="editName" required maxlength="100" placeholder="例：ジョンジーの精霊"></label>
<label>レベル<input class="field" id="editLevel" type="number" min="0" max="999" value="1"></label>
<label>状態<select class="field" id="editStatus"><option value="available">登場済み</option><option value="upcoming">登場予定</option></select></label>
<label class="wide">画像URL（任意）<input class="field" id="editImage" type="url" placeholder="https://…"></label><label class="wide">または端末から画像を選択<input class="field" id="editImageFile" type="file" accept="image/*"><span class="notice">画像は自動で縮小・圧縮して保存します。容量を節約するため、正方形に近い画像がおすすめです。</span></label><div class="wide" id="imagePreview" style="font-size:12px;color:#9ba7bb"></div>
</div><div class="checks"><label><input id="editOwned" type="checkbox"> 所持</label><label><input id="editMaster" type="checkbox"> Master</label><label><input id="editNew" type="checkbox"> 新着</label></div><div class="modal-actions"><button type="button" id="cancelEdit">キャンセル</button><button class="primary" type="submit">保存</button></div></form></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(() => {
const KEY='sprite-check-offline-v1';
const starter=[
{name:'ジョンジーの精霊',level:1,status:'available'},
{name:'ニャッスルの精霊',level:1,status:'available'},
{name:'ピーリーの精霊',level:1,status:'available'},
{name:'フィッシュスティックの精霊',level:1,status:'available'},
{name:'ラマの精霊',level:1,status:'available'},
{name:'シャドーの精霊',level:1,status:'available'},
{name:'ネコの精霊',level:1,status:'upcoming'}
];
let sprites=load(), filter='all', toastTimer;
const $=id=>document.getElementById(id);
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sprites));$('saveState').textContent='保存済み';render()}catch{$('saveState').textContent='保存失敗';showToast('端末の保存容量が不足しています。画像を小さくするか、件数を減らしてください。')}}
function id(){return 's_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function safeUrl(value){if(typeof value==='string'&&value.startsWith('data:image/'))return value;try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(s){const t=$('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
let pendingImage='';
function render(){
 const query=$('search').value.trim().toLocaleLowerCase();
 let arr=sprites.filter(s=>(s.name||'').toLocaleLowerCase().includes(query));
 arr=arr.filter(s=>filter==='all'||(filter==='owned'&&s.owned)||(filter==='missing'&&!s.owned&&s.status!=='upcoming')||(filter==='master'&&s.master)||(filter==='upcoming'&&s.status==='upcoming')||(filter==='new'&&s.isNew));
 const sort=$('sort').value;arr.sort((a,b)=>sort==='level'?(Number(b.level)||0)-(Number(a.level)||0):sort==='owned'?(Number(!!b.owned)-Number(!!a.owned)):(a.name||'').localeCompare(b.name||'','ja'));
 $('total').textContent=sprites.length;$('ownedCount').textContent=sprites.filter(s=>s.owned).length;$('masterCount').textContent=sprites.filter(s=>s.master).length;
 const list=$('list');
 if(!arr.length){list.innerHTML='<div class="panel empty" style="grid-column:1/-1">該当する精霊がいません。<br>「＋ 追加」から登録できます。</div>';return}
 list.innerHTML=arr.map(s=>{const image=safeUrl(s.image||'');return '<article class="item"><div class="portrait">'+(image?'<img loading="lazy" src="'+esc(image)+'" alt="" onerror="this.remove()">':'✦')+'</div><div class="details"><div class="name">'+esc(s.name)+'</div><div class="meta">'+(s.status==='upcoming'?'<span class="tag">登場予定</span>':'')+(s.owned?'<span class="tag owned">所持</span>':'<span class="tag missing">未所持</span>')+(s.master?'<span class="tag new">Master</span>':'')+(s.isNew?'<span class="tag new">新着</span>':'')+'<span class="tag">Lv.'+(Number(s.level)||0)+'</span></div><label class="mini"><input type="checkbox" data-action="owned" data-id="'+esc(s.id)+'" '+(s.owned?'checked':'')+'> 所持にする</label><div class="item-actions"><button data-action="master" data-id="'+esc(s.id)+'">'+(s.master?'★ Master解除':'☆ Master')+'</button><button data-action="edit" data-id="'+esc(s.id)+'">編集</button></div></div></article>'}).join('');
}
function openEditor(s){pendingImage=s?.image||'';$('editForm').reset();$('editId').value=s?.id||'';$('dialogTitle').textContent=s?'精霊を編集':'精霊を追加';$('editName').value=s?.name||'';$('editLevel').value=s?.level??1;$('editStatus').value=s?.status||'available';$('editImage').value=(s?.image||'').startsWith('data:')?'':(s?.image||'');$('editImageFile').value='';$('imagePreview').innerHTML=s?.image?'<img src="'+esc(s.image)+'" alt="画像プレビュー" style="width:72px;height:72px;object-fit:cover;border-radius:10px"> <button type="button" id="removeImageBtn">画像を削除</button>':'画像未設定';$('editOwned').checked=!!s?.owned;$('editMaster').checked=!!s?.master;$('editNew').checked=!!s?.isNew;$('editor').showModal();const rb=$('removeImageBtn');if(rb)rb.onclick=()=>{pendingImage='';$('imagePreview').textContent='画像を削除予定';}}
$('addBtn').addEventListener('click',()=>openEditor());
$('cancelEdit').addEventListener('click',()=>$('editor').close());
$('editImageFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('画像ファイルを選んでください');return}try{pendingImage=await compressImage(file);$('editImage').value='';$('imagePreview').innerHTML='<img src="'+pendingImage+'" alt="画像プレビュー" style="width:72px;height:72px;object-fit:cover;border-radius:10px">';showToast('画像を準備しました。保存ボタンで確定します')}catch{showToast('画像を読み込めませんでした')}});
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,512/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.78))};img.src=reader.result};reader.readAsDataURL(file)})}
$('editForm').addEventListener('submit',e=>{e.preventDefault();const old=sprites.find(s=>s.id===$('editId').value);const name=$('editName').value.trim();if(!name)return;const image=$('editImage').value.trim();if(image&&!safeUrl(image)){showToast('画像URLは http:// または https:// で入力してください');return}const item={id:old?.id||id(),name,level:Math.min(999,Math.max(0,Number($('editLevel').value)||0)),status:$('editStatus').value,image:pendingImage||safeUrl(image),owned:$('editOwned').checked,master:$('editMaster').checked,isNew:$('editNew').checked};if(old)sprites=sprites.map(s=>s.id===old.id?item:s);else sprites.push(item);save();$('editor').close();showToast(old?'更新しました':'追加しました')});
$('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;$('filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('list').addEventListener('change',e=>{const c=e.target.closest('input[data-action="owned"]');if(!c)return;const s=sprites.find(x=>x.id===c.dataset.id);if(s){s.owned=c.checked;save()}});
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const s=sprites.find(x=>x.id===b.dataset.id);if(!s)return;if(b.dataset.action==='edit')openEditor(s);if(b.dataset.action==='master'){s.master=!s.master;save();showToast(s.master?'Masterに設定しました':'Masterを解除しました')}});
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);
$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({format:'sprite-check-backup',version:1,exportedAt:new Date().toISOString(),sprites},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sprite-check-backup.json';a.click();URL.revokeObjectURL(url);showToast('バックアップを保存しました')});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());const arr=Array.isArray(data)?data:data.sprites;if(!Array.isArray(arr))throw Error();if(!confirm('現在のデータを置き換えて、'+arr.length+'件を復元しますか？'))return;sprites=arr.filter(s=>s&&typeof s.name==='string').map(s=>({id:typeof s.id==='string'?s.id:id(),name:s.name.slice(0,100),level:Math.max(0,Number(s.level)||0),status:s.status==='upcoming'?'upcoming':'available',image:safeUrl(s.image||''),owned:!!s.owned,master:!!s.master,isNew:!!s.isNew}));save();showToast('復元しました')}catch{showToast('バックアップファイルを読み込めませんでした')}finally{e.target.value=''}});
$('sampleBtn').addEventListener('click',()=>{if(!confirm('サンプルの精霊を、未登録の名前だけ追加しますか？名前は仮の例で、公式情報の確認済みリストではありません。'))return;let n=0;for(const s of starter)if(!sprites.some(x=>x.name===s.name)){sprites.push({id:id(),...s,owned:false,master:false,isNew:false,image:''});n++}save();showToast(n+'件のサンプルを追加しました')});
$('clearBtn').addEventListener('click',()=>{if(!confirm('登録した精霊とチェック状況をすべて削除します。この操作は取り消せません。先にバックアップを保存しましたか？'))return;sprites=[];save();showToast('データを削除しました')});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
</body>
</html>
